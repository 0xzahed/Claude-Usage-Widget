name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        # Pinned to the version the project is developed and checked on.
        with: { channel: stable, flutter-version: 3.47.9 }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Bridge
        run: cd bridge && dart pub get && dart analyze && dart test
